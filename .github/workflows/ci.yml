name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Build and test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['11', '21']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Cache tool downloads (JUnit, SpotBugs, PIT)
        uses: actions/cache@v4
        with:
          path: build/lib
          key: build-lib-jdk${{ matrix.java }}-junit-1.10.2-spotbugs-4.8.6-pit-1.15.8

      - name: Compile both controllers, run tests, regenerate docs
        run: tools/run-tests.sh

      - name: Generated docs match the code
        if: matrix.java == '21'
        run: git diff --exit-code -- docs/benchmark-results.md docs/images/mission-map.svg docs/images/before-after.svg docs/images/before-after-dark.svg docs/route-planner.md docs/images/route-planner.svg docs/images/mission-replay.svg

      - name: Webots comparison builds (dry run, no Webots needed)
        run: tools/run-in-webots.sh --dry-run v1 v2 v2-hand-tuned

      - name: Lint shell scripts
        if: matrix.java == '21'
        run: shellcheck tools/*.sh

      - name: Static analysis (SpotBugs; v2 must have no findings)
        if: matrix.java == '21'
        run: tools/static-analysis.sh

      - name: Mutation testing (PIT; at least 90% of changes must be caught)
        if: matrix.java == '21'
        run: tools/mutation-test.sh

  webots:
    name: Whole mission in Webots (v2)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Webots R2025a
        id: webots-cache
        uses: actions/cache@v4
        with:
          path: ~/webots
          key: webots-R2025a-x86-64

      - name: Download Webots R2025a
        if: steps.webots-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 3 -o /tmp/webots.tar.bz2 \
            https://github.com/cyberbotics/webots/releases/download/R2025a/webots-R2025a-x86-64.tar.bz2
          tar -xjf /tmp/webots.tar.bz2 -C ~

      - name: Install what Webots needs to run headless
        run: |
          sudo apt-get update -qq
          # libsndio7.0 and libasound2t64: Webots' bundled OpenAL won't load without them
          # (webots-bin then exits with status 127 before writing anything).
          sudo apt-get install -y -qq xvfb xauth libglu1-mesa libegl1 libopengl0 libsndio7.0 \
            libasound2t64 libdbus-1-3 libx11-xcb1 libxcb-util1 libxcb-xkb1 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-render0 libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-xfixes0 \
            libxcb-xinerama0 libxcb-xinput0 libxcb-cursor0

      # Webots fetches the world's protos and textures from raw.githubusercontent.com and caches
      # them. From the runners those downloads fail ("Connection closed"), and the run spent its
      # whole 45 minutes retrying them, so fill the cache from the release's assets archive.
      - name: Cache Webots assets
        id: webots-assets-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cyberbotics/Webots/assets
          key: webots-assets-R2025a

      - name: Download Webots assets
        if: steps.webots-assets-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 3 -o /tmp/assets.zip \
            https://github.com/cyberbotics/webots/releases/download/R2025a/assets-R2025a.zip
          mkdir -p ~/.cache/Cyberbotics/Webots/assets
          unzip -q /tmp/assets.zip -d ~/.cache/Cyberbotics/Webots/assets
          rm /tmp/assets.zip

      - name: Webots starts
        run: |
          LD_LIBRARY_PATH=~/webots/lib/webots ldd ~/webots/bin/webots-bin | { ! grep 'not found'; }
          xvfb-run -a ~/webots/webots --version

      - name: Run v2's whole mission in Webots
        timeout-minutes: 25
        run: WEBOTS_HOME=~/webots tools/run-in-webots.sh --limit 1500 --out build/ci-webots v2

      - name: Nothing had to be downloaded
        run: "! grep -E 'Cannot download|Error downloading' build/ci-webots/v2/webots.log"

      - name: Every jar was delivered
        run: |
          cat build/ci-webots/v2/result.properties
          grep -qx 'delivered=5' build/ci-webots/v2/result.properties

      - name: Keep the run's log and paths
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webots-v2-run
          path: |
            build/ci-webots/report.md
            build/ci-webots/paths.svg
            build/ci-webots/v2/webots.log
            build/ci-webots/v2/result.properties
            build/ci-webots/v2/trajectory.csv
