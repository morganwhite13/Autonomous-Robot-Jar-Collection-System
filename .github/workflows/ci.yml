name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Build and test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['11', '21']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Cache JUnit download
        uses: actions/cache@v4
        with:
          path: build/lib
          key: junit-console-1.10.2

      - name: Compile both controllers, run tests, regenerate docs
        run: tools/run-tests.sh

      - name: Generated docs match the code
        if: matrix.java == '21'
        run: git diff --exit-code -- docs/benchmark-results.md docs/images/mission-map.svg docs/images/before-after.svg

      - name: Webots comparison builds (dry run, no Webots needed)
        run: tools/run-in-webots.sh --dry-run

      - name: Lint shell scripts
        if: matrix.java == '21'
        run: shellcheck tools/*.sh
